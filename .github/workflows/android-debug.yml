name: Android debug build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # v3 requested the removed Android SDK 'tools' package.
      # v4 installs supported platform-tools without requesting legacy tools.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Verify Gradle 8.9 Wrapper
        run: bash SETUP-UNIX.sh
      - name: Build debug APK
        run: bash gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BekoHome-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
